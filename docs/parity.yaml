# 语阅 · 多端功能对照表（Layer 1）
#
# 每条功能记录在 mac / ios / android / windows 四端的状态与测试证据：
#   status:
#     done    - 已实现，必须声明至少一条可校验的 tests 证据
#     partial - 部分实现，必须填写 note 说明缺口
#     planned - 计划中，必须填写 note 说明计划/优先级
#     na      - 该平台不适用，必须填写 note 说明原因
#
# tests 证据格式（由 scripts/check-parity.mjs 自动核验文件与符号是否存在）：
#   rust:<path-under-core>::<test_fn>
#   conformance:<case-id>
#   reader:<spec-file>
#   apple:<path-under-apple>::<symbol>
#   android:<path-under-android>::<symbol>
#   windows:<path-under-windows>::<symbol>
#   midscene:<scenario-yaml>
#   sync-e2e:<scenario-id>
#   script:<repo-relative-path>
#   manual:<testing.md-ref>

