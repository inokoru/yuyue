# 复制到私有仓库（inokoru/yuyue-feedback）的 .github/workflows/relay.yml。
# 公开的语阅仓库不放这份工作流，也不放密钥。
#
# 由 Cloudflare Worker（feedback/worker/）每 5 分钟检查 ntfy.sh，发现未处理反馈时
# 通过 workflow_dispatch 按需唤醒本工作流（也可在网页上手动点 Run workflow），把反馈搬进
# 语阅仓库（公开）的 Issue，打「反馈」标签。
# 公开截图与文件附件均推到 inokoru/yuyue-feedback-assets（公开），方便开源社区复现与调试；
# 旧版客户端（0.1.0 / 0.1.1）发来的密封附件仍兼容存到本仓库 feedback-files/。
#
# 不再使用 GitHub 原生 on.schedule：私有仓库上的定时触发经常延迟 4～8 小时或静默丢弃，
# 会错过 ntfy.sh 附件 3 小时的有效期；改走 workflow_dispatch 秒级启动，平时无反馈零消耗，
# 也不会触发 60 天无提交自动停用。
#
# secrets：
#   NTFY_TOPIC        话题名
#   ISSUE_TOKEN       fine-grained token，只给 inokoru/yuyue 的 Issues 读写
#   SHOTS_DEPLOY_KEY  inokoru/yuyue-feedback-assets 的部署密钥（私钥那一半，允许写），只能动那个仓库
name: 转发反馈

on:
  workflow_dispatch:

permissions:
  contents: write   # 密封附件提交到本仓库 feedback-files/

concurrency:
  group: feedback-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      SHOTS_REPO: inokoru/yuyue-feedback-assets
      GIT_SSH_COMMAND: ssh -i ${{ github.workspace }}/../shots-key -o IdentitiesOnly=yes -o StrictHostKeyChecking=accept-new
    steps:
      - uses: actions/checkout@v4
      - name: 取公开附件仓库
        env:
          KEY: ${{ secrets.SHOTS_DEPLOY_KEY }}
        run: |
          printf '%s\n' "$KEY" > "$GITHUB_WORKSPACE/../shots-key"
          chmod 600 "$GITHUB_WORKSPACE/../shots-key"
          git clone -q --depth 1 "git@github.com:$SHOTS_REPO.git" "$RUNNER_TEMP/shots"
      - name: 拉取 ntfy 并开 Issue
        run: python3 feedback/relay/relay.py
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          ISSUE_REPO: inokoru/yuyue
          ISSUE_TOKEN: ${{ secrets.ISSUE_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHOTS_DIR: ${{ runner.temp }}/shots
      - name: 删掉密钥文件
        if: always()
        run: rm -f "$GITHUB_WORKSPACE/../shots-key"
