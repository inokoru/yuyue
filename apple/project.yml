# The Xcode project is generated from this file: `cd apple && xcodegen`.
# Build the core first: `apple/build-core.sh`. The reader bundle comes from `reader/dist`
# (`cd reader && pnpm build`).
name: Yuyue
options:
  bundleIdPrefix: app.yuyue
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  developmentLanguage: zh-Hans
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  YuyueCore:
    path: YuyueCore
  OnnxRuntime:
    path: OnnxRuntime
  # 检查更新 on the Mac (not the App Store's): see App/Updates.swift.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  # 界面快照. Test target only — not linked into the app.
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.19.7
  # 匿名使用统计 (AirTraffic / PostHog; pinned to 3.98.2 for /batch compatibility and Swift 6.0).
  PostHog:
    url: https://github.com/PostHog/posthog-ios
    exactVersion: 3.98.2

settings:
  base:
    MARKETING_VERSION: 0.1.4
    CURRENT_PROJECT_VERSION: 6
    SWIFT_VERSION: "6.0"
    # 英文界面: every Chinese string is a key in Yuyue/Localizable.xcstrings.
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # 关于 里那个"阅"字标：主图标与 5 枚备选图标由脚本按同一套比例生成（见 docs/dev/app-icon.md）。
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES

targets:
  Yuyue:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Yuyue
        excludes:
          - "**/.DS_Store"
      # Served to the WebView as /app/… (docs/dev/reader-contract.md §1).
      - path: ../reader/dist
        type: folder
        buildPhase: resources
      # Wi‑Fi 传书's page for the computer, shared with Android.
      - path: ../shared/wifi-page.html
        buildPhase: resources
      # 更新日志 in 关于, parsed offline by `parseChangelog`.
      - path: ../CHANGELOG.md
        buildPhase: resources
    dependencies:
      - package: YuyueCore
      - package: OnnxRuntime
        product: OnnxRuntimeC
      - package: Sparkle
        destinationFilters: [macOS]
      - package: PostHog
        product: PostHog
    scheme: {}
    info:
      path: Yuyue/Info.plist
      properties:
        CFBundleDisplayName: 语阅
        # Impactor 注册 App ID 时只留英文字母。中文名会被滤成空字符串，苹果报缺 appIdName。
        CFBundleName: Yuyue
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.books
        # 同步 · Google Drive: the iOS OAuth client of 语阅's Google Cloud project, once registered.
        YYGoogleClientID: $(GOOGLE_CLIENT_ID)
        # AirFeedback App Attest (iOS): 10-char Apple Team ID from DEVELOPMENT_TEAM when signed.
        YuyueAppleTeamID: $(DEVELOPMENT_TEAM)
        # 反馈: empty until Feedback.local.xcconfig fills it in. Not committed.
        YuyueFeedbackTopic: $(YUYUE_FEEDBACK_TOPIC)
        ITSAppUsesNonExemptEncryption: false
        # 检查更新 (Mac): the newest release's appcast and its EdDSA key; UpdateCenter checks, Sparkle's
        # installer runs as its own service from the sandbox.
        SUFeedURL: https://github.com/inokoru/yuyue/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: false
        SUEnableInstallerLauncherService: true
        UIBackgroundModes: [audio]
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Opened files are read where they are (security-scoped) and copied into the library.
        LSSupportsOpeningDocumentsInPlace: true
        # 数据快照 are kept in Documents, which 文件 shows as 语阅.
        UIFileSharingEnabled: true
        # Wi‑Fi 传书: a computer's browser on the same Wi‑Fi sends books to the phone.
        # 远程书库 at home are plain http on a local address.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: 电脑浏览器给语阅传书、从你的 Mac 传有声书录音时，要经过你的 Wi‑Fi 连到这台设备。
        # 局域网传录音: a Mac with the recording, found on the same network.
        NSBonjourServices: [_yuyue-rec._tcp]
        # 克隆声音与播客语音插话: kept on this device; only sent to ElevenLabs when explicitly enabled.
        # 有声书对齐与播客本地转写: turned into words on this device, never uploaded.
        NSSpeechRecognitionUsageDescription: 有声书对齐、播客本地转写和语音插话时，在这台设备上把声音转成文字。录音不会离开这台设备。
        NSMicrophoneUsageDescription: 克隆声音或播客语音插话提问时使用麦克风。录音留在这台设备上，只在你主动开启 ElevenLabs 时才传到你自己的账号。
        CFBundleDocumentTypes:
          - CFBundleTypeName: EPUB
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [org.idpf.epub-container]
          - CFBundleTypeName: Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
          - CFBundleTypeName: PDF
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [com.adobe.pdf]
          - CFBundleTypeName: Kindle 电子书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [app.yuyue.mobi, app.yuyue.azw3]
          - CFBundleTypeName: 有声书
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.audio]
          - CFBundleTypeName: 语阅快照
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes: [app.yuyue.snapshot]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: app.yuyue.snapshot
            UTTypeDescription: 语阅快照
            UTTypeConformsTo: [public.data, public.archive]
            UTTypeTagSpecification:
              public.filename-extension: [yuyue]
        UTImportedTypeDeclarations:
          # Kindle books: an old MOBI (also .azw, .prc), or KF8 (.azw3).
          - UTTypeIdentifier: app.yuyue.mobi
            UTTypeDescription: Kindle 电子书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [mobi, azw, prc]
          - UTTypeIdentifier: app.yuyue.azw3
            UTTypeDescription: Kindle 电子书
            UTTypeConformsTo: [public.data, public.content]
            UTTypeTagSpecification:
              public.filename-extension: [azw3]
    configFiles:
      Debug: Config/Feedback.xcconfig
      Release: Config/Feedback.xcconfig
    settings:
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
      base:
        PRODUCT_NAME: Yuyue
        # Placeholder until the App Store identity is settled.
        PRODUCT_BUNDLE_IDENTIFIER: app.yuyue.Yuyue
        # Empty until 语阅 is registered with Google; 同步 · Google Drive waits for it.
        GOOGLE_CLIENT_ID: ""
        # 检查更新: the public half of the key releases are signed with (scripts/publish-release.sh).
        SPARKLE_PUBLIC_KEY: Zy+Y3wu9H5cZ6z+pjflE/tiHWoDQMlU4QXEsMZDl4p4=
        # YUYUE_FEEDBACK_TOPIC / _PUBLIC_KEY come only from Config/Feedback.xcconfig (and the
        # local file it includes): a value here would win over the xcconfig. Unset expands to "".
        TARGETED_DEVICE_FAMILY: "1,2"
        # Mac 打包时分别出 Apple 芯片（arm64）与 Intel（x86_64）两个包。
        "ARCHS[sdk=macosx*]": "$(ARCHS_STANDARD)"
        SUPPORTS_MACCATALYST: NO
        CODE_SIGN_STYLE: Automatic
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Yuyue/Yuyue.entitlements
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        "ENABLE_HARDENED_RUNTIME[sdk=macosx*]": YES
        # The Mac app keeps its frameworks (Sparkle) in Contents/Frameworks, not beside the binary.
        "LD_RUNPATH_SEARCH_PATHS[sdk=macosx*]": "$(inherited) @executable_path/../Frameworks"
    scheme:
      testTargets:
        - YuyueSnapshotTests
  # 界面快照: isolated SwiftUI, recorded as PNGs next to these tests.
  # System permission dialogs, Sparkle and the WebView reader stay on scripts/window-catalog.sh.
  YuyueSnapshotTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources:
      - path: YuyueSnapshotTests
    dependencies:
      - target: Yuyue
      - package: SnapshotTesting
        product: SnapshotTesting
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.yuyue.YuyueSnapshotTests
        GENERATE_INFOPLIST_FILE: YES
        # XCTest's entry points are nonisolated. The app target defaults the actor to MainActor;
        # these tests opt out and mark the UI cases @MainActor themselves.
        SWIFT_DEFAULT_ACTOR_ISOLATION: nonisolated
        "CODE_SIGN_IDENTITY[sdk=macosx*]": "-"
        CODE_SIGN_STYLE: Automatic
        # On macOS the app binary lives at Contents/MacOS/Yuyue, not beside Yuyue.app.
        "TEST_HOST[sdk=macosx*]": "$(BUILT_PRODUCTS_DIR)/Yuyue.app/Contents/MacOS/Yuyue"
        "BUNDLE_LOADER[sdk=macosx*]": "$(TEST_HOST)"
