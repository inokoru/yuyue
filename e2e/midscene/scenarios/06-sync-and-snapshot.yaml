id: 06-sync-and-snapshot
title: 整库数据快照备份恢复与 WebDAV 同步设置入口
testing_ref: testing.md#一.13,五.1-2
parity_ids:
  - sync.webdav_and_conflict
  - sync.snapshot_backup
fixtures:
  - books/beiying.epub
platforms:
  - windows
  - macos
  - android
  - ios

tasks:
  - name: 验证数据快照与 WebDAV 同步配置界面完整
    flow:
      - ai: 打开应用设置，进入「数据与同步」或「同步与备份」页面
      - sleep: 1000
      - aiAssert: 页面同时可见 WebDAV 同步配置入口与数据快照（.yuyue）备份/恢复入口
      - ai: 点击生成数据快照，确认包含进度、笔记与设置并保存
      - sleep: 2000
      - aiAssert: 快照生成成功，界面显示最新快照记录或导出成功提示
