id: 06-sync-and-snapshot
title: 整库数据快照备份恢复与 WebDAV 同步设置入口
testing_ref: testing.md#一.13,五.1-2
parity_ids:
  - sync.webdav_and_conflict
  - sync.snapshot_backup
fixtures:
  - books/beiying.epub
platforms:
  - windows
  - macos
  - android
  - ios

tasks:
  - name: 验证 WebDAV 同步与数据快照配置界面完整
    flow:
      - ai: 打开应用设置，进入「同步」（或「数据与同步」/「同步与备份」）页面
      - sleep: 1000
      - aiAssert: 页面清晰可见 WebDAV 同步配置入口（或同步方式选择）
      - ai: 若当前页面未直接显示数据快照，则切换到设置中的「数据」页面
      - sleep: 800
      - aiAssert: 页面清晰可见整库数据快照（.yuyue）的导出备份与导入恢复入口
      - ai: 点击导出或生成数据快照入口，确认包含进度、笔记与设置并保存
      - sleep: 2000
      - aiAssert: 快照流程正常响应，界面无崩溃或报错弹窗
