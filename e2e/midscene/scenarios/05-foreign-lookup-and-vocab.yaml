id: 05-foreign-lookup-and-vocab
title: 外文原著点词查释义、整句翻译与加入生词本
testing_ref: testing.md#一.9
parity_ids:
  - foreign.lookup_and_vocab
fixtures:
  - books/great-gatsby.epub
platforms:
  - windows
  - macos
  - android
  - ios

tasks:
  - name: 点词查询释义并收藏到生词本
    flow:
      - ai: 从书架导入并打开测试夹具中的 great-gatsby.epub，进入正文第一章
      - sleep: 1500
      - ai: 确保外文点词功能已开启，然后单击正文中的一个英文单词
      - sleep: 1000
      - aiAssert: 弹出释义卡片，显示该英文单词及中文释义
      - ai: 点击卡片上的加入生词本按钮
      - sleep: 800
      - aiAssert: 按钮状态变为已加入生词本或已收藏
      - ai: 关闭释义卡片并进入生词本视图
      - sleep: 1000
      - aiAssert: 生词本列表中包含刚刚收藏的英文单词
