afterEach:
  - yuyue.close: {}

cases:
  - name: 深色模式打开红楼梦并验证翻页、目录跳章与排版面板
    steps:
      - yuyue.launch:
          theme: dark
          fixtures:
            - hongloumeng.epub
      - aiWaitFor:
          prompt: 语阅窗口已以深色模式打开《红楼梦》并显示正文内容
          options:
            timeoutMs: 25000
      - aiAssert:
          prompt: 界面为深色背景，正文文字对比度清晰可读，左右边界与顶部工具栏没有互相遮挡或撑破
      - aiKeyboardPress: Right
      - sleep:
          ms: 800
      - aiAssert:
          prompt: 翻页后阅读器仍然处于正常显示状态，没有白屏、卡死或错位
      - aiTap: 语阅窗口顶部工具栏最左侧、返回箭头「←」左侧的目录侧边栏图标（注意不是右侧「笔记」左侧的对照阅读图标）
      - sleep:
          ms: 700
      - aiTap: 语阅窗口内左侧展开的「目录」面板列表中的任意一个正文回目标题（如「第一回」或「第二回」）
      - sleep:
          ms: 1000
      - aiAssert:
          prompt: 语阅窗口内左侧目录面板正常显示《红楼梦》章节列表且右侧正文清晰可读，没有界面重叠或报错弹窗
      - aiAct: 点击顶部工具栏中的「外观」或「Aa」排版设置按钮打开排版浮层
      - sleep:
          ms: 800
      - aiAssert:
          prompt: 排版浮层完整可见，包含纸张主题、字号或行距调节控件，深色模式下对比度清晰无裁切
      - aiKeyboardPress: Escape
      - sleep:
          ms: 400

  - name: 打开 PDF 夹具校验页面渲染
    steps:
      - yuyue.launch:
          fixtures:
            - sample.pdf
      - aiWaitFor:
          prompt: 语阅窗口已打开 PDF 阅读视图并渲染出文档页面内容
          options:
            timeoutMs: 25000
      - aiAssert:
          prompt: PDF 页面内容正常可见，没有空白画布、错位或崩溃提示
